    <!-- Professional External Browser Detection & Redirection Script -->
    <script>
      (function() {
        'use strict';
        
        // Comprehensive browser detection
        const userAgent = navigator.userAgent.toLowerCase();
        const isEmbedded = userAgent.includes('webview') || 
                          userAgent.includes('wv') ||
                          userAgent.includes('telegram') ||
                          userAgent.includes('whatsapp') ||
                          userAgent.includes('instagram') ||
                          userAgent.includes('facebook') ||
                          userAgent.includes('twitter') ||
                          userAgent.includes('line') ||
                          userAgent.includes('snapchat') ||
                          userAgent.includes('tiktok') ||
                          userAgent.includes('linkedin');
        
        const isTelegram = userAgent.includes('telegram') || 
                          userAgent.includes('telegramwebview') ||
                          window.location.href.includes('tgWebAppPlatform');
        
        // Store browser info globally for React app
        window.__BROWSER_INFO__ = {
          isEmbedded: isEmbedded,
          isTelegram: isTelegram,
          userAgent: navigator.userAgent,
          timestamp: Date.now()
        };
        
        // Professional external browser opening handler
        window.__OPEN_EXTERNAL__ = function(url = window.location.href) {
          try {
            // Method 1: Standard window.open with aggressive flags
            const opened = window.open(url, '_blank', 'noopener,noreferrer,menubar=yes,toolbar=yes,location=yes,status=yes,scrollbars=yes,resizable=yes');
            
            if (!opened || opened.closed) {
              // Method 2: Create temporary link element
              const link = document.createElement('a');
              link.href = url;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.style.display = 'none';
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
            }
            
            // Method 3: Native app deep links (fallback)
            setTimeout(() => {
              try {
                // Try Chrome
                window.location.href = 'googlechrome://navigate?url=' + encodeURIComponent(url);
              } catch (e) {
                try {
                  // Try Safari
                  window.location.href = url;
                } catch (e2) {
                  // Final fallback - copy to clipboard
                  if (navigator.clipboard) {
                    navigator.clipboard.writeText(url);
                    alert('Link copied to clipboard! Please paste it in your browser.');
                  }
                }
              }
            }, 100);
            
          } catch (error) {
            console.error('Failed to open external browser:', error);
            // Ultimate fallback
            if (navigator.clipboard) {
              navigator.clipboard.writeText(url);
              alert('Please copy this link to your browser: ' + url);
            }
          }
        };
        
        // Auto-redirect for shared links in embedded browsers
        if (isEmbedded && window.location.search.includes('utm_source=share')) {
          console.log('[EXTERNAL_BROWSER] Auto-redirecting shared link from embedded browser');
          setTimeout(() => {
            window.__OPEN_EXTERNAL__();
          }, 1000);
        }
        
        // Enhanced sharing functionality
        window.__SMART_SHARE__ = function(platform, url = window.location.href, title = document.title) {
          const shareUrl = encodeURIComponent(url + '?utm_source=share&utm_medium=' + platform);
          const shareTitle = encodeURIComponent(title);
          
          let platformUrl;
          switch (platform) {
            case 'telegram':
              platformUrl = `https://t.me/share/url?url=${shareUrl}&text=${shareTitle}`;
              break;
            case 'whatsapp':
              platformUrl = `https://wa.me/?text=${shareTitle}%20${shareUrl}`;
              break;
            case 'facebook':
              platformUrl = `https://www.facebook.com/sharer/sharer.php?u=${shareUrl}`;
              break;
            case 'twitter':
              platformUrl = `https://twitter.com/intent/tweet?url=${shareUrl}&text=${shareTitle}`;
              break;
            case 'linkedin':
              platformUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${shareUrl}`;
              break;
            default:
              platformUrl = url;
          }
          
          window.__OPEN_EXTERNAL__(platformUrl);
        };
        
        console.log('[EXTERNAL_BROWSER] Detection complete:', {
          isEmbedded: isEmbedded,
          isTelegram: isTelegram,
          userAgent: userAgent
        });
        
      })();
    </script>
