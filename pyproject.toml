[tool.poetry]
name = "travel-planner-ai"
version = "0.1.0"
description = "Travel Planner AI using FastAPI, GPT-4o, and React"
authors = ["Vitalii Kudriavtcev <vkusa87@gmail.com>"]
packages = [
    { include = "travel_planner_ai" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.103.2"
uvicorn = "^0.27.0"
openai = "^1.64.0"
python-dotenv = "^1.0.0"
cachetools = "^5.3.2"
pydantic = { extras = ["email"], version = "^2.10.6" }
google-auth = "^2.28.1"
requests = "^2.32.3"
pymongo = { extras = ["srv"], version = "^4.7" }
stripe = "^12.0.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.25.3"
httpx = "^0.28.1"
pytest-cov = "^6.0.0"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
